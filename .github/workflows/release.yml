name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          build() {
            local goos="$1"
            local goarch="$2"
            local extension="$3"
            local archive="$4"
            local staging="dist/staging/${goos}-${goarch}"
            mkdir -p "$staging"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$staging/LogMonitor${extension}" ./cmd/logmonitor
            cp config.example.yaml "$staging/"
            cp README.md "$staging/"
            tar -C "dist/staging" -czf "dist/${archive}" "${goos}-${goarch}"
          }

          build windows amd64 .exe LogMonitor-${VERSION}-windows-amd64.tar.gz
          build linux amd64 "" LogMonitor-${VERSION}-linux-amd64.tar.gz
          build linux arm64 "" LogMonitor-${VERSION}-linux-arm64.tar.gz

          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes
