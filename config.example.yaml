log_sources:
  - name: linux-app
    file: "/var/log/myapp/app.log"
    level_regex: "\\[\\s*([A-Za-z][A-Za-z0-9_-]*)\\s*\\]"
    levels: [ERROR, FATAL]
    before_lines: 5
    after_lines: 5

  - name: windows-app
    directory: "C:/logs/myapp"
    pattern: "*.log"
    level_regex: "\\[\\s*([A-Za-z][A-Za-z0-9_-]*)\\s*\\]"
    recursive: true
    levels: [WARN, ERROR]
    before_lines: 10
    after_lines: 10

feishu:
  webhook_url: "${FEISHU_WEBHOOK_URL}"
  enable_signature: 1
  secret: "${FEISHU_SECRET}"

notification:
  cooldown_seconds: 60
  # 同来源、同级别的告警在窗口内合并，0 表示不合并
  aggregate_seconds: 5
  max_context_lines: 100
  max_context_bytes: 65536
  retry_count: 3

runtime:
  memory_limit_mb: 256
  read_chunk_bytes: 65536
  max_line_bytes: 1048576
  max_tracked_files: 1000
