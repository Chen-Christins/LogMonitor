name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version; defaults to the first CHANGELOG heading"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Read version from CHANGELOG
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION}"
          else
            version="$(sed -nE 's/^##[[:space:]]+\[?(v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)\]?.*$/\1/p' CHANGELOG.md | head -n 1)"
          fi
          [[ -n "${version}" ]] || { echo "No version found in CHANGELOG.md" >&2; exit 1; }
          [[ "${version}" == v* ]] || version="v${version}"
          [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid version: ${version}" >&2
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Using version ${version}"

      - name: Skip existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release ${VERSION} already exists; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        if: steps.existing.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^##[[:space:]]+\\[?" version "\\]?([[:space:]]|$)" { found=1; next }
            found && /^##[[:space:]]+/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG entry found for ${VERSION}" >&2
            exit 1
          fi

      - name: Build release archives
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          build() {
            local goos="$1"
            local goarch="$2"
            local extension="$3"
            local archive="$4"
            local staging="dist/staging/${goos}-${goarch}"
            mkdir -p "$staging"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$staging/LogMonitor${extension}" ./cmd/logmonitor
            cp config.example.yaml "$staging/"
            cp README.md "$staging/"
            tar -C "dist/staging" -czf "dist/${archive}" "${goos}-${goarch}"
          }

          build windows amd64 .exe LogMonitor-${VERSION}-windows-amd64.tar.gz
          build linux amd64 "" LogMonitor-${VERSION}-linux-amd64.tar.gz
          build linux arm64 "" LogMonitor-${VERSION}-linux-arm64.tar.gz

          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Publish GitHub Release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --draft
